---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: installer
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - endpoints
  - nodes
  - persistentvolumes
  - pods
  - secrets
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
  - create
  - update
  # `kubectl apply` PATCHes an already-existing object, so upgrades need patch.
  - patch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterrolebindings
  - clusterroles
  verbs:
  - get
  - list
  - create
  - update
  # `kubectl apply` PATCHes an already-existing object, so upgrades need patch.
  - patch
# Namespace is rendered by sysdig-common-config unless
# sysdigCommonConfig.skipNamespace is true. namespaces is cluster-scoped, so this
# cannot be granted by the namespaced Role. namespaces:get is additionally
# required to be allowed to create the `ingress-controller` ClusterRole, which
# lists it.
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - create
  - patch
  - update
# Ingress moved to networking.k8s.io in Kubernetes 1.19 and extensions/v1beta1
# Ingress was removed entirely in 1.22, so on a modern cluster a grant on
# `extensions` alone authorizes nothing. `extensions` is kept alongside it so
# this example continues to work on clusters older than 1.22.
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - list
  - get
  - watch
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingresses/status
  verbs:
  - update
# charts/haproxy-ingress/templates/ingressclass.yaml creates the cluster-scoped
# IngressClass `haproxy`. It is gated on global.deployment == "kubernetes", which
# is why none of the openshift* examples need this rule. get/list/watch under
# both apiGroups is additionally required to be allowed to create the
# `ingress-controller` ClusterRole, which lists ingressclasses under both.
- apiGroups:
  - extensions
  - networking.k8s.io
  resources:
  - ingressclasses
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
# The installer applies CRDs itself, ahead of the rest of each chart. On a
# default install metadata-service ships a CRD (metadataService.enabled and
# metadataService.operatorEnabled are both true), so this is required even
# without Postgres HA. With HA it also covers the three acid.zalan.do CRDs -
# see examples/rbac/kubernetes-pgha for the full HA rule set.
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - create
  - update
  - patch
